; REAL33D engine configuration.
;
; The slice has no authored map. It boots the empty engine map and the game
; mode builds the scene in C++, so everything that defines a run stays
; reviewable as text and reproducible from a clean checkout.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/REAL33D.Real33DGameMode

[/Script/Engine.RendererSettings]
; Auto exposure would keep rebalancing the image as tiles appear and vanish,
; which makes two screenshots of the same scene look different. Fixed exposure
; keeps the evidence comparable.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=1
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.AntiAliasing=2
; Lumen on placeholder primitives buys nothing and costs a long warm-up on this
; machine. The scene is lit by two directional lights.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.AllowStaticLighting=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=94A1B2C64E256DDC203B2297078B7EA1
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=

